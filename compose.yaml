name: powerbridge
# PostgreSQL: DATABASE_URL, SUPERSET_METADATA_URL and REPORTING_DATABASE_URI come from .env.
# COMPOSE_PROFILES=db in .env runs the bundled `postgres` service (URLs use host `postgres`).
# For an external DB (RDS etc.) remove COMPOSE_PROFILES=db and point the three URLs at it.
# Each image is built once (by migrate / superset-init); other services reuse it.
x-app: &app
  image: powerbridge-app
  pull_policy: never
  env_file: .env
  environment: &app-env
    # Container ports are fixed; choose host ports with API_PORT / WEB_PORT / SUPERSET_PORT.
    PORT: "3001"
    REDIS_URL: redis://redis:6379
    STORAGE_ROOT: /data/uploads
  volumes:
    - uploads:/data/uploads
  extra_hosts: ["host.docker.internal:host-gateway"]
  init: true
  restart: unless-stopped
x-superset: &superset
  image: powerbridge-superset
  pull_policy: never
  env_file: .env
  environment: &superset-env
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    SUPERSET_PORT: "8088" # container port; the host port comes from .env SUPERSET_PORT
  extra_hosts: ["host.docker.internal:host-gateway"]
services:
  postgres:
    profiles: [db]
    image: powerbridge-postgres
    build:
      context: infra/docker
      dockerfile: postgres.Dockerfile
    pull_policy: build
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: platform
      REPORTING_PASSWORD: ${REPORTING_PASSWORD:-}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-}
    volumes:
      # The image's init script runs only when this volume is first created:
      # makes reporting_reader, superset_meta and the superset DB.
      - postgres:/var/lib/postgresql/data
    ports: ["127.0.0.1:${POSTGRES_PORT:-8053}:5432"]
    restart: always # also restarts after a reboot; stop.sh leaves it running
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.7-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    pull_policy: build
    restart: "no"
    command: ["pnpm", "--filter", "@platform/api", "migration:run:prod"]
    depends_on:
      postgres: { condition: service_healthy, required: false }
  seed:
    # Creates ADMIN_EMAIL as admin if missing; safe to re-run.
    <<: *app
    restart: "no"
    command: ["node", "apps/api/dist/database/seed.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    <<: *app
    command: ["pnpm", "--filter", "@platform/api", "start"]
    ports: ["${BIND_ADDR:-127.0.0.1}:${API_PORT:-8051}:3001"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    <<: *app
    command: ["pnpm", "--filter", "@platform/worker", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    <<: *app
    command: ["pnpm", "--filter", "@platform/web", "start"]
    environment:
      <<: *app-env
      PORT: "3000"
      API_URL: http://api:3001
      NODE_ENV: production
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8050}:3000"]
    depends_on: [api]
  superset-init:
    <<: *superset
    build: ./infra/superset
    pull_policy: build
    command: ["/bin/sh", "/app/bootstrap/init.sh"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  superset:
    <<: *superset
    ports: ["${BIND_ADDR:-127.0.0.1}:${SUPERSET_PORT:-8052}:8088"]
    restart: unless-stopped
    depends_on:
      superset-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
  superset-register:
    # One-shot: registers the read-only reporting DB, approved views and SYNTHETIC example charts via REST API.
    <<: *superset
    environment:
      <<: *superset-env
      SUPERSET_INTERNAL_URL: http://superset:8088
    command: ["python", "/app/bootstrap/register.py"]
    depends_on:
      superset: { condition: service_healthy }
volumes:
  postgres:
  redis:
  uploads:
