name: powerbridge
# PostgreSQL is external: DATABASE_URL, SUPERSET_METADATA_URL and REPORTING_DATABASE_URI come from .env.
# A database on this same machine is reachable from containers as host.docker.internal.
# Each image is built once (by migrate / superset-init); other services reuse it.
x-app: &app
  image: powerbridge-app
  pull_policy: never
  env_file: .env
  environment: &app-env
    # Container ports are fixed; choose host ports with API_PORT / WEB_PORT / SUPERSET_PORT.
    PORT: "3001"
    REDIS_URL: redis://redis:6379
    STORAGE_ROOT: /data/uploads
  volumes:
    - uploads:/data/uploads
  extra_hosts: ["host.docker.internal:host-gateway"]
  init: true
  restart: unless-stopped
x-superset: &superset
  image: powerbridge-superset
  pull_policy: never
  env_file: .env
  environment: &superset-env
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  extra_hosts: ["host.docker.internal:host-gateway"]
services:
  redis:
    image: redis:7.4.7-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    pull_policy: build
    restart: "no"
    command: ["pnpm", "--filter", "@platform/api", "migration:run:prod"]
  seed:
    # Creates ADMIN_EMAIL as admin if missing; safe to re-run.
    <<: *app
    restart: "no"
    command: ["node", "apps/api/dist/database/seed.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    <<: *app
    command: ["pnpm", "--filter", "@platform/api", "start"]
    ports: ["${BIND_ADDR:-127.0.0.1}:${API_PORT:-3001}:3001"]
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    <<: *app
    command: ["pnpm", "--filter", "@platform/worker", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  web:
    <<: *app
    command: ["pnpm", "--filter", "@platform/web", "start"]
    environment:
      <<: *app-env
      PORT: "3000"
      API_URL: http://api:3001
      NODE_ENV: production
    ports: ["${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"]
    depends_on: [api]
  superset-init:
    <<: *superset
    build: ./infra/superset
    pull_policy: build
    command: ["/bin/sh", "/app/bootstrap/init.sh"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  superset:
    <<: *superset
    ports: ["${BIND_ADDR:-127.0.0.1}:${SUPERSET_PORT:-8088}:8088"]
    restart: unless-stopped
    depends_on:
      superset-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
  superset-register:
    # One-shot: registers the read-only reporting DB, approved views and SYNTHETIC example charts via REST API.
    <<: *superset
    environment:
      <<: *superset-env
      SUPERSET_INTERNAL_URL: http://superset:8088
    command: ["python", "/app/bootstrap/register.py"]
    depends_on:
      superset: { condition: service_healthy }
volumes:
  redis:
  uploads:
